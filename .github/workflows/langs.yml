name: Update languages card
on:
  schedule: [{ cron: "30 0 * * *" }]
  workflow_dispatch:
  push:
    paths: ["scripts/langs.py", ".github/workflows/langs.yml"]
permissions:
  contents: write
jobs:
  langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/langs.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --staged --quiet || (git commit -m "chore: update languages card" && git push)
